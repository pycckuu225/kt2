<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <div class="header">
        <div class="logo">Start</div>
        <div class="user-profile">
            <span>User</span>
            <img src="images/Avatar.png" alt="Avatar" style="width: 50px; height: 50px;">
        </div>
    </div>
    <div class="start-menu">
        <div class="left-part">
            <div class="menu-item" style="background-color: rgb(125, 171, 75);"><img src="images/mail.png" alt="Mail"><span>Mail</span></div>
            <div class="menu-item" style="background-color: cornflowerblue;"><img src="images/контакты.png" alt="Contacts"><span>Contacts</span></div>
            <div class="menu-item" style="background-color: rgb(237, 178, 100);"><img src="images/сообщение.png" alt="Messages"><span>Messages</span></div>
            <div class="menu-item bg-item bg-flowers"><span>Desktop</span></div>
            <div class="menu-item" style="background-color: lightcoral;"><img src="images/календарь.png" alt="Calendar"><span>Calendar</span></div>
            <div class="menu-item" style="background-color: rgb(125, 171, 75);"><img src="images/галерея.png" alt="Photos"><span>Photos</span></div>
            <div class="menu-item" style="background-color: rgb(115, 75, 171);"><img src="images/банк.png" alt="Finances"><span>Finances</span></div>
            <div class="menu-item" style="background-color: rgb(182, 196, 57);"><img src="images/погода.png" alt="Weather"><span>Weather</span></div>
            <div class="menu-item double-item">
                <div class="double-item-content" style="background-color: rgb(182, 196, 57);"><img src="images/браузер.png" alt="Chrome"><span>Chrome</span></div>
                <div class="double-item-content" style="background-color: rgb(237, 178, 100);"><img src="images/магазин.png" alt="Store"><span>Store</span></div>
            </div>
            <div class="menu-item double-item">
                <div class="double-item-content" style="background-color: rgb(115, 75, 171);"><img src="images/карты.png" alt="Maps"><span>Maps</span></div>
                <div class="double-item-content" style="background-color: rgb(35, 57, 196);"><img src="images/облако.png" alt="OneDrive"><span>oneDrive</span></div>
            </div>
            <div class="menu-item" style="background-color: lightcoral;"><img src="images/спорт.png" alt="Sports"><span>Sports</span></div>
            <div class="menu-item" style="background-color: cornflowerblue;"><img src="images/новости.png" alt="News"><span>News</span></div>
        </div>
        <div class="right-part">
            <div class="menu-item bg-item bg-plane"><span>Bar</span></div>
            <div class="menu-item" style="background-color: lightcoral;"><img src="images/багаж.png" alt="Travel"><span>Travel</span></div>
            <div class="menu-item double-item">
                <div class="double-item-content" style="background-color: rgb(125, 171, 75);"><img src="images/игры.png" alt="Games"><span>Games</span></div>
                <div class="double-item-content" style="background-color: cornflowerblue;"><img src="images/камера.png" alt="Camera"><span>Camera</span></div>
            </div>
            <div class="menu-item double-item">
                <div class="double-item-content" style="background-color: rgb(237, 178, 100);"><img src="images/музыка.png" alt="Music"><span>Music</span></div>
                <div class="double-item-content" style="background-color: rgb(115, 75, 171);"><img src="images/видео.png" alt="Video"><span>Video</span></div>
            </div>
        </div>
    </div>
</body>
</html>
